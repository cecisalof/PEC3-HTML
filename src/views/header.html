<header class="relative w-full h-screen overflow-hidden">
  <!-- Imagen responsive con <picture> -->
  <picture>
    <!-- Desktop HD -->
    <source srcset="./assets/images/header/hero-home-2400.avif 2x, ./assets/images/header/hero-home-1920.avif 1x"
      type="image/avif" media="(min-width: 100em)" sizes="100vw">
    <source srcset="./assets/images/header/hero-home-2400.webp 2x, ./assets/images/header/hero-home-1920.webp 1x"
      type="image/webp" media="(min-width: 100em)" sizes="100vw">
    <source srcset="./assets/images/header/hero-home-2400.jpg 2x, ./assets/images/header/hero-home-1920.jpg 1x"
      type="image/jpeg" media="(min-width: 100em)" sizes="100vw">

    <!-- Desktop -->
    <source srcset="./assets/images/header/hero-home-1200.avif" type="image/avif" media="(min-width: 75em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-home-1200.webp" type="image/webp" media="(min-width: 75em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-home-1200.jpg" type="image/jpeg" media="(min-width: 75em)"
      sizes="100vw">

    <!-- Tablet -->
    <source srcset="./assets/images/header/hero-home-768.avif" type="image/avif" media="(min-width: 48em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-home-768.webp" type="image/webp" media="(min-width: 48em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-home-768.jpg" type="image/jpeg" media="(min-width: 48em)"
      sizes="100vw">

    <!-- Mobile -->
    <source srcset="./assets/images/header/hero-mobile-480.avif" type="image/avif" media="(max-width: 47.99em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-mobile-480.webp" type="image/webp" media="(max-width: 47.99em)"
      sizes="100vw">
    <source srcset="./assets/images/header/hero-mobile-480.jpg" type="image/jpeg" media="(max-width: 47.99em)"
      sizes="100vw">

    <!-- Fallback image -->
    <img src="./assets/images/header/hero-mobile-480.jpg" alt="Hands on earth"
      class="absolute top-0 left-0 w-full h-full object-cover z-0" sizes="100vw">
  </picture>

  <!-- Navbar -->
  <div class="relative z-10">
    <!-- Aquí insertas tu navbar Tailwind refactorizado -->
    <include src="./views/navbar.html"></include>
  </div>

  <!-- Texto superpuesto -->
  <div class="absolute inset-0 flex flex-col justify-center items-center text-center px-4 z-10 text-white bg-black/30">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-4">
      Juntos, hacia un <span class="text-green-300">futuro redondo</span>
    </h1>
    <h2 class="text-xl sm:text-2xl md:text-3xl font-medium mb-6">
      Primeras Jornadas de Economía Circular
    </h2>
    <div class="text-base sm:text-lg md:text-xl space-y-1">
      <p>Septiembre 2025</p>
      <p>Centro Artesanal Torrearte</p>
      <p>Madrid</p>
    </div>
  </div>
</header>
