<picture class="header__image">
  <!-- Desktop HD (pantallas grandes > 1600px) -->
  <source
    srcset="./assets/images/about/hero-about-2400.avif 2x, ./assets/images/about/hero-about-1920.avif 1x"
    type="image/avif" media="(min-width: 100em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-2400.webp 2x, ./assets/images/about/hero-about-1920.webp 1x"
    type="image/webp" media="(min-width: 100em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-2400.jpg 2x, ./assets/images/about/hero-about-1920.jpg 1x"
    type="image/jpeg" media="(min-width: 100em)" sizes="100vw">

  <!-- Desktop normal (1200px - 1599px) -->
  <source
    srcset="./assets/images/about/hero-about-1200.avif"
    type="image/avif" media="(min-width: 75em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-1200.webp"
    type="image/webp" media="(min-width: 75em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-1200.jpg"
    type="image/jpeg" media="(min-width: 75em)" sizes="100vw">

  <!-- Tablet (768px - 1199px) -->
  <source
    srcset="./assets/images/about/hero-about-768.avif"
    type="image/avif" media="(min-width: 48em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-768.webp"
    type="image/webp" media="(min-width: 48em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-768.jpg"
    type="image/jpeg" media="(min-width: 48em)" sizes="100vw">

  <!-- Mobile (<768px) -->
  <source
    srcset="./assets/images/about/hero-about-480.avif"
    type="image/avif" media="(max-width: 47.99em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-480.webp"
    type="image/webp" media="(max-width: 47.99em)" sizes="100vw">
  <source
    srcset="./assets/images/about/hero-about-480.jpg"
    type="image/jpeg" media="(max-width: 47.99em)" sizes="100vw">

  <!-- Fallback JPG -->
  <img src="./assets/images/about/hero-about-480.jpg" alt="Hands on earth"
  class="header__image" sizes="100vw">
</picture>
